services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: course_generator
      POSTGRES_USER: course_generator
      POSTGRES_PASSWORD: course_generator
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U course_generator -d course_generator"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
